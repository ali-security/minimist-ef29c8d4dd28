# minimist predates GitHub Actions: upstream tests exclusively on Travis
# (see .travis.yml, which runs the full tap suite on Node 0.8/0.10/0.12/io.js).
# This workflow therefore only builds and packs the release tarball; the test
# legs deliberately live on Travis and are not duplicated here.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '13'

      # Pure JS, no build step and no prepare/prepack script, so packing needs
      # no dependency install at all.
      - name: Pack the release tarball
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: minimist-1.2.5.tgz
          if-no-files-found: error
